name: Lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bash syntax
        run: |
          bash -n pxe_install.sh
          bash -n scripts/prepare-media.sh

      - name: ShellCheck
        run: |
          shellcheck pxe_install.sh scripts/prepare-media.sh
